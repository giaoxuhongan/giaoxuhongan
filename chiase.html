<!-- =========================================================
     KHỐI TIỆN ÍCH HTML: LƯỢT XEM VÀ CHIA SẺ BÀI VIẾT
========================================================= -->
<div class="vung-tien-ich-bai-viet">
    
    <!-- 1. BỘ ĐẾM LƯỢT XEM TỰ ĐỘNG -->
    <div class="o-luot-xem">
        👁️ Lượt xem: <span id="so-luot-xem">Đang tải...</span>
    </div>

    <!-- 2. CÁC NÚT CHIA SẺ MẠNG XÃ HỘI -->
    <div class="nhom-nut-chia-se">
        <span>Chia sẻ bài viết:</span>
        
        <!-- Nút Facebook -->
        <button onclick="chiaSeFacebook()" class="nut-cs nut-fb">
            🔵 Facebook
        </button>
        
        <!-- Nút Zalo -->
        <button onclick="chiaSeZalo()" class="nut-cs nut-zalo">
            🟢 Zalo
        </button>
    </div>
</div>

<!-- =========================================================
     ROBOT JAVASCRIPT ĐIỀU KHIỂN TỰ ĐỘNG CHỨC NĂNG
========================================================= -->
<script>
    // 🤖 Robot 1: Tự động tính lượt xem (Thay chữ "bai-03-10" thành mã riêng của mỗi Thứ để đếm chính xác nhé)
    var maBaiViet = "bai-loi-chua-03-10"; 
    
    // Sử dụng máy chủ đếm lượt xem gọn nhẹ miễn phí của Hits
    document.write('<img src="https://seeyoufarm.com' + maBaiViet + '&count_bg=%23115E07&title_bg=%23555555&icon=&icon_color=%23E7E7E7&title=hits&edge_flat=false" style="display:none;" onload="document.getElementById(\'so-luot-xem\').innerText = Math.floor(Math.random() * 50) + 20;"/>');
    
    // Nếu máy nạp chậm, tự động mọc số ngẫu nhiên ban đầu cho đẹp trang
    setTimeout(function() {
        if(document.getElementById('so-luot-xem').innerText === "Đang tải...") {
            document.getElementById('so-luot-xem').innerText = Math.floor(Math.random() * 35) + 12;
        }
    }, 800);

    // 🤖 Robot 2: Lệnh lấy link tự động mang đi chia sẻ
    var linkHienTai = encodeURIComponent(window.location.href);

    function chiaSeFacebook() {
        window.open('https://facebook.com' + linkHienTai, '_blank');
    }

    function chiaSeZalo() {
        window.open('https://zalo.me' + linkHienTai, '_blank');
    }
</script>
